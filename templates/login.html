<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineStar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <div class="auth-brand"><i class="fas fa-film"></i> CineStar</div>
        <section class="auth-card">
            <div class="auth-icon"><i class="fas fa-user"></i></div>
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Sign in to access your movie watchlist.</p>
            {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
            <form method="post" class="auth-form">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit" class="auth-button">Login</button>
            </form>
            <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
        </section>
    </main>
</body>
</html>
